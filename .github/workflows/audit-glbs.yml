name: Auditar GLBs pesados (sem modificar originais)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-heavy-glbs.py'
      - 'scripts/audit-glb.cjs'
      - '.github/workflows/audit-glbs.yml'
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantidade dos maiores GLBs a auditar'
        required: true
        default: '12'
        type: choice
        options:
          - '5'
          - '12'
          - '25'
          - '62'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout apenas de metadados e scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            catalogo.json
            scripts
            reports
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar catálogo e verificar auditor
        run: |
          node --check scripts/audit-glb.cjs
          node scripts/build-catalog.cjs
      - name: Inspecionar GLBs sem modificar arquivos
        env:
          AUDIT_LIMIT: ${{ inputs.quantidade || '12' }}
        run: python scripts/audit-heavy-glbs.py
      - name: Guardar relatório para baixar
        uses: actions/upload-artifact@v4
        with:
          name: rexx-auditoria-glbs
          path: |
            audit-results.json
            audit-results.md

      - name: Publicar relatório Markdown e JSON sem alterar GLBs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add reports/glb-audit.md reports/glb-audit.json
          if git diff --cached --quiet; then
            echo "Relatório não mudou"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: atualizar auditoria técnica de GLBs pesados"
          git pull --rebase origin main
          git push origin HEAD:main
